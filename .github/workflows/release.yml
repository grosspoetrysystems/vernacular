name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a version tag
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Run this workflow against a v* tag." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "${GITHUB_REF_NAME} is not a supported semantic version tag." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify released version
        shell: bash
        run: |
          ARCHIVE=".release/vernacular_${{ steps.version.outputs.version }}_linux_amd64.tar.gz"
          tar -xOf "${ARCHIVE}" vern > /tmp/vern
          chmod +x /tmp/vern
          ACTUAL="$(/tmp/vern --version)"
          if [ "${ACTUAL}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Built CLI reports ${ACTUAL}; expected ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi

      - name: Pack npm distributions
        run: node scripts/package-npm.mjs "${{ steps.version.outputs.version }}"

      - name: Upload npm distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ steps.version.outputs.version }}
          path: .release/npm/
          include-hidden-files: true
          retention-days: 1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .release/*.tar.gz
            .release/*.zip

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted-publishing npm version
        shell: bash
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const required = [11, 5, 1];
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const actual = version.split('.').map(Number);
          const firstDiff = actual.findIndex((part, index) => part !== required[index]);
          const ok = actual.length === 3 && actual.every(Number.isFinite) &&
            (firstDiff === -1 || actual[firstDiff] > required[firstDiff]);
          if (!ok) {
            console.error(`npm ${version} is too old for trusted publishing; need >= ${required.join('.')}.`);
            process.exit(1);
          }
          console.log(`npm ${version} supports trusted publishing.`);
          NODE

      - name: Download npm distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ needs.release.outputs.version }}
          path: .release/npm/

      - name: Publish to npm
        run: node scripts/publish-npm.mjs

  smoke-npm:
    needs: [release, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install and run the published package
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SPEC="@grosspoetrysystems/vernacular@${VERSION}"
          for attempt in $(seq 1 60); do
            if npm view "${SPEC}" version --prefer-online >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              echo "npm did not expose ${SPEC} within ten minutes." >&2
              exit 1
            fi
            sleep 10
          done
          mkdir smoke && cd smoke
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "@grosspoetrysystems/vernacular@${VERSION}"
          ACTUAL="$(./node_modules/.bin/vern --version)"
          if [ "${ACTUAL}" != "${VERSION}" ]; then
            echo "Published CLI reports ${ACTUAL}; expected ${VERSION}." >&2
            exit 1
          fi
          test -f node_modules/@grosspoetrysystems/vernacular/skills/vernacular/SKILL.md

  publish-release:
    needs: [release, smoke-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish inspected GitHub release
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
