name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Format
        run: test -z "$(golangci-lint fmt --diff ./...)"
      - name: Lint
        run: golangci-lint run ./...
      - name: Test
        run: go test -cover ./...
      - name: Smoke
        run: go run ./cmd/vern help
      - name: Skill durability check
        run: |
          go build -o "$RUNNER_TEMP/bin/vern" ./cmd/vern
          export PATH="$RUNNER_TEMP/bin:$PATH" HOME="$RUNNER_TEMP/home"
          repo="$RUNNER_TEMP/repo"
          git init -q "$repo"
          git -C "$repo" -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m init
          (cd "$repo" && vern init >/dev/null && sh "$GITHUB_WORKSPACE/skills/vernacular/scripts/check.sh")
